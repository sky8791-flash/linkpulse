name: linkpulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse_dev_password}
      POSTGRES_DB: linkpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse -d linkpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://linkpulse:${POSTGRES_PASSWORD:-linkpulse_dev_password}@postgres:5432/linkpulse?sslmode=disable
      API_KEY: ${API_KEY:-local-demo-api-key-123456}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      VISITOR_HASH_SECRET: ${VISITOR_HASH_SECRET:-local-demo-visitor-secret-123456}
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Asia/Shanghai}
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
